[package]
name = "spec-xray"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/mod.rs"

[dependencies]
anyhow = "1.0.105"
arboard = "3.6"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
indoc = "2.0.8"
notify = "8.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
